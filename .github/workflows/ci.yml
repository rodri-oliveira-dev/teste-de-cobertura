name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-coverage:
    name: Restore, build, test and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.400'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore DotNet.CodeCoverage.slnx

      - name: Verify formatting
        run: dotnet format DotNet.CodeCoverage.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build DotNet.CodeCoverage.slnx --configuration Release --no-restore

      - name: Test unit and collect coverage
        run: >-
          dotnet test MaiorDeIdade.Tests/MaiorDeIdade.Tests.csproj
          --configuration Release
          --no-build
          --results-directory artifacts/test-results/unit
          --coverlet
          --coverlet-output-format cobertura

      - name: Test integration and collect coverage
        run: >-
          dotnet test MaiorDeIdade.IntegrationTests/MaiorDeIdade.IntegrationTests.csproj
          --configuration Release
          --no-build
          --results-directory artifacts/test-results/integration
          --coverlet
          --coverlet-output-format cobertura

      - name: Verify coverage reports
        shell: bash
        run: |
          coverage_count="$(find artifacts/test-results -type f -name 'coverage.cobertura*.xml' | wc -l)"

          if [ "$coverage_count" -lt 2 ]; then
            echo "Esperados relatórios de cobertura dos testes unitários e de integração; encontrados: $coverage_count."
            exit 1
          fi

          echo "Relatórios de cobertura encontrados: $coverage_count"

      - name: Generate combined coverage report
        run: >-
          dotnet reportgenerator
          -reports:"artifacts/test-results/**/coverage.cobertura*.xml"
          -targetdir:"artifacts/coverage-report"
          -reporttypes:"Html;TextSummary;MarkdownSummaryGithub"

      - name: Publish coverage summary
        shell: bash
        run: |
          cat artifacts/coverage-report/Summary.txt
          cat artifacts/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce combined coverage quality gate
        run: >-
          dotnet reportgenerator
          -reports:"artifacts/test-results/**/coverage.cobertura*.xml"
          -targetdir:"artifacts/coverage-gate"
          -reporttypes:"TextSummary"
          --minimumCoverageThresholds:lineCoverage=90
          --minimumCoverageThresholds:branchCoverage=90

      - name: Test E2E against real Kestrel process
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:5055
        run: |
          mkdir -p artifacts/e2e

          dotnet MaiorDeIdade.Api/bin/Release/net10.0/MaiorDeIdade.Api.dll             --urls "$E2E_BASE_URL"             > artifacts/e2e/api.log 2>&1 &
          api_pid=$!

          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent "$E2E_BASE_URL/health" > /dev/null; then
              ready=true
              break
            fi

            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "A API encerrou antes de ficar pronta."
              cat artifacts/e2e/api.log
              exit 1
            fi

            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "A API não ficou pronta dentro do tempo esperado."
            cat artifacts/e2e/api.log
            exit 1
          fi

          dotnet test MaiorDeIdade.E2ETests/MaiorDeIdade.E2ETests.csproj             --configuration Release             --no-build             --results-directory artifacts/test-results/e2e

      - name: Upload E2E diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-diagnostics
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            artifacts/test-results/**/coverage.cobertura*.xml
            artifacts/coverage-report/
          if-no-files-found: error
          retention-days: 7
