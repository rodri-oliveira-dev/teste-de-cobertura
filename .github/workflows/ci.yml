name: CI

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-coverage:
    name: Restore, build, test and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore XUnit.Coverage.sln

      - name: Build
        run: dotnet build XUnit.Coverage.sln --configuration Release --no-restore

      - name: Test and collect coverage
        run: >-
          dotnet test XUnit.Coverage.sln
          --configuration Release
          --no-build
          --results-directory artifacts/test-results
          --coverlet
          --coverlet-output-format cobertura

      - name: Locate coverage report
        id: coverage
        shell: bash
        run: |
          coverage_file="$(find artifacts/test-results -type f -name 'coverage.cobertura*.xml' -print -quit)"

          if [ -z "$coverage_file" ]; then
            echo "Cobertura não foi gerada."
            exit 1
          fi

          echo "file=$coverage_file" >> "$GITHUB_OUTPUT"
          echo "Arquivo de cobertura: $coverage_file"

      - name: Generate coverage report
        run: >-
          dotnet reportgenerator
          -reports:"${{ steps.coverage.outputs.file }}"
          -targetdir:"artifacts/coverage-report"
          -reporttypes:"Html;TextSummary;MarkdownSummaryGithub"

      - name: Publish coverage summary
        shell: bash
        run: cat artifacts/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage quality gate
        run: >-
          dotnet reportgenerator
          -reports:"${{ steps.coverage.outputs.file }}"
          -targetdir:"artifacts/coverage-gate"
          -reporttypes:"TextSummary"
          -minimumCoverageThresholds:lineCoverage=90
          -minimumCoverageThresholds:branchCoverage=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            artifacts/test-results/**/coverage.cobertura*.xml
            artifacts/coverage-report/
          if-no-files-found: error
          retention-days: 7
